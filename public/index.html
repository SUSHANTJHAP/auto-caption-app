<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCaption - AI Video Captions</title>
    <meta name="description" content="Generate high-quality captions for large video files instantly using AI.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="logo">Auto<span>Caption</span></h1>
            <p class="subtitle">Lightning-fast, AI-powered subtitles for videos up to 1GB.</p>
        </header>

        <div class="upload-card">
            <div id="drop-zone" class="drop-zone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p class="drag-text">Drag & drop your video here</p>
                <p class="limit-text">MP4, MOV, MKV up to 1GB</p>
                <button id="browse-btn" class="primary-btn">Browse Files</button>
                <input type="file" id="file-input" accept="video/*" hidden>
            </div>
            
            <div id="file-info" class="file-info hidden">
                <div class="file-details">
                    <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <div class="file-meta">
                        <p id="file-name" class="file-name">video.mp4</p>
                        <p id="file-size" class="file-size">10.5 MB</p>
                    </div>
                </div>
                <button id="remove-btn" class="icon-btn" title="Remove file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <button id="generate-btn" class="primary-btn generate-btn hidden">
                Generate Captions
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>

            <div id="progress-container" class="progress-container hidden">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="status-text" class="status-text">Uploading video... Please wait.</p>
            </div>
        </div>

        <div id="result-card" class="result-card hidden">
            <h2>Success! Captions Generated.</h2>
            <div class="actions">
                <button id="download-srt" class="secondary-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download .SRT
                </button>
            </div>
            <div class="preview-box">
                <pre id="srt-preview"></pre>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
